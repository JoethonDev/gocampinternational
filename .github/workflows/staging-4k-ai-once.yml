name: One-time Cloudflare AI high resolution image enhancement
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths: [".github/workflows/staging-4k-ai-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate high resolution AI source variants in staging R2
        env:
          UPSCALE_WORKER: https://gocamp-staging-ai-4k-20261101.elprincedoca.workers.dev
        run: |
          node --input-type=module <<'JS'
          const base=process.env.UPSCALE_WORKER;
          let after="", count=0, completed=0, failed=[];
          async function run(cursor){
            for(let i=0;i<6;i++){
              try {
                const r=await fetch(base+"/batch",{
                  method:"POST",
                  headers:{"Content-Type":"application/json"},
                  body:JSON.stringify({after:cursor}),
                  signal:AbortSignal.timeout(75000)
                });
                const text=await r.text();
                if(!r.ok||!text.trimStart().startsWith("{"))throw Error("HTTP "+r.status+" "+text.slice(0,130));
                return JSON.parse(text);
              }catch(e){
                if(i===5)throw e;
                console.log("Retry",i+1,String(e).slice(0,160));
                await new Promise(ok=>setTimeout(ok,(i+1)*3000));
              }
            }
          }
          for(let i=0;i<100;i++){
            const r=await run(after);
            if(r.done){console.log("FINISHED",JSON.stringify({count,completed,failed}));if(failed.length)process.exitCode=2;break;}
            if(!r.after||r.after===after)throw Error("non-progressing cursor");
            count++;after=r.after;
            if(r.created)completed++;
            if(r.errors?.length){failed.push({key:r.key,errors:r.errors});console.log("FAILED",r.key,r.errors);}
            else console.log("AI-4K",count,r.key,r.width||"skipped",r.bytes||"");
            if(i===99)throw Error("cursor didn't finish");
          }
          JS
