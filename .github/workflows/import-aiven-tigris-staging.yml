name: GoCamp manual staging database and media import
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type IMPORT STAGING (never changes production)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  staging-import:
    if: ${{ inputs.confirm == 'IMPORT STAGING' }}
    runs-on: ubuntu-latest
    environment: gocamp-staging-import
    concurrency:
      group: gocamp-staging-import
      cancel-in-progress: false
    env:
      GOCAMP_ENV: staging
      GOCAMP_DATA_SOURCE: postgres
      GOCAMP_DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
      GOCAMP_DB_PORT: ${{ secrets.AIVEN_DB_PORT }}
      GOCAMP_DB_NAME: staging
      GOCAMP_DB_USER: ${{ secrets.AIVEN_DB_USER }}
      GOCAMP_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
      GOCAMP_DB_CA_CERT: ${{ runner.temp }}/aiven-ca.pem
      GOCAMP_CACHE_DIR: ${{ runner.temp }}/catalog-cache
      TIGRIS_BUCKET: gocamp-staging
      TIGRIS_ACCESS_KEY: ${{ secrets.TIGRIS_ACCESS_KEY }}
      TIGRIS_SECRET_KEY: ${{ secrets.TIGRIS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, curl, fileinfo, gd
      - name: Configure server certificate
        env:
          AIVEN_CA_PEM_BASE64: ${{ secrets.AIVEN_CA_PEM_BASE64 }}
        run: |
          test -n "$AIVEN_CA_PEM_BASE64"
          printf '%s' "$AIVEN_CA_PEM_BASE64" | base64 -d > "$GOCAMP_DB_CA_CERT"
          chmod 600 "$GOCAMP_DB_CA_CERT"
      - name: Apply schema (staging only)
        run: |
          export PGHOST="$GOCAMP_DB_HOST" PGPORT="$GOCAMP_DB_PORT" PGDATABASE="$GOCAMP_DB_NAME"
          export PGUSER="$GOCAMP_DB_USER" PGPASSWORD="$GOCAMP_DB_PASSWORD"
          export PGSSLMODE=verify-full PGSSLROOTCERT="$GOCAMP_DB_CA_CERT"
          psql -X -v ON_ERROR_STOP=1 -f database/001_catalog.sql
      - name: Import reviewed catalogs from committed legacy snapshot
        run: php deploy/import-staging.php --confirm-staging
      - name: Import committed image files into private bucket
        run: php deploy/import-images.php --confirm-staging
      - name: Verify counts without exposing content
        run: |
          export PGHOST="$GOCAMP_DB_HOST" PGPORT="$GOCAMP_DB_PORT" PGDATABASE="$GOCAMP_DB_NAME"
          export PGUSER="$GOCAMP_DB_USER" PGPASSWORD="$GOCAMP_DB_PASSWORD"
          export PGSSLMODE=verify-full PGSSLROOTCERT="$GOCAMP_DB_CA_CERT"
          psql -X -v ON_ERROR_STOP=1 -c "SELECT 'programs' AS entity,count(*) FROM programs UNION ALL SELECT 'destinations',count(*) FROM destinations UNION ALL SELECT 'categories',count(*) FROM program_categories UNION ALL SELECT 'media',count(*) FROM media_assets"
