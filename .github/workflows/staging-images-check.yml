name: Staging image pipeline checks
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths:
      - "cloudflare-app/**"
      - ".github/workflows/staging-images-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate binding types
        run: npm run cf-typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run
