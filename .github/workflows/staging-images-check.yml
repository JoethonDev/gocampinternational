name: Staging image pipeline checks
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths:
      - "cloudflare-app/**"
      - ".github/workflows/staging-images-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - name: Probe Cloudflare Images free entitlement with R2 source
        run: |
          curl -sS --retry 2 --retry-delay 2 --max-time 70 --fail-with-body \
            'https://gocamp-staging-image-probe-20261101.elprincedoca.workers.dev/probe-ai' \
            | tee /tmp/gocamp-image-probe.json
          node -e 'const f=require("fs");const data=JSON.parse(f.readFileSync("/tmp/gocamp-image-probe.json","utf8"));console.log("AI access:",data.ai?.ok ? "available" : "unavailable","standard:",data.standard?.ok ? "available" : "unavailable");if(!data.ai?.ok&&!data.standard?.ok)process.exitCode=1'
      - name: Install dependencies
        run: npm ci
      - name: Generate binding types
        run: npm run cf-typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run
