name: Cloudflare application checks
on:
  push:
    paths: ["cloudflare-app/**", ".github/workflows/cloudflare-migration-check.yml"]
  pull_request:
    paths: ["cloudflare-app/**", ".github/workflows/cloudflare-migration-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run format:check
      - run: npm run check
      - name: Reject legacy sources and private data in public output
        run: |
          test -z "$(find .. -path '*/node_modules' -prune -o -path '*/.git' -prune -o -type f -name '*.php' -print)"
          test ! -e build/client/data
          test ! -e build/client/admin
          test ! -e build/client/.env
