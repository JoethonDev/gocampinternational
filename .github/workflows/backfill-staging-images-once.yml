name: One-time staging R2 image enhancement
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths: [".github/workflows/backfill-staging-images-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Enhance all existing staging R2 images using free Cloudflare Images
        env:
          IMAGE_WORKER: https://gocamp-staging-images-batch-20261101.elprincedoca.workers.dev
        run: |
          node --input-type=module <<'JS'
          const base=process.env.IMAGE_WORKER;
          const summary={processed:0,created:0,skipped:0,failures:[],done:false};
          let after="";
          async function call(path,body) {
            for(let retry=0;retry<3;retry++){
              try {
                const response=await fetch(base+path,{
                  method:body?"POST":"GET",
                  headers:body?{"Content-Type":"application/json"}:undefined,
                  body:body?JSON.stringify(body):undefined,
                  signal:AbortSignal.timeout(110000)
                });
                const data=await response.json();
                if(!response.ok)throw Error(response.status+" "+JSON.stringify(data));
                return data;
              }catch(e){
                if(retry===2)throw e;
                await new Promise(resolve=>setTimeout(resolve,(retry+1)*1400));
              }
            }
          }
          console.log("Starting",await call("/status"));
          for(let i=0;i<400;i++){
            const data=await call("/run",{after});
            if(data.done){summary.done=true;break;}
            if(!data.processed || !data.after || data.after===after)throw Error("non-progressing cursor "+JSON.stringify(data));
            after=data.after;
            summary.processed++;
            summary.created+=(data.result?.created||[]).length;
            summary.skipped+=(data.result?.skipped||[]).length;
            if(data.result?.failed?.length){
              summary.failures.push({key:data.result.key,errors:data.result.failed});
              console.log("FAILED",data.result.key,JSON.stringify(data.result.failed));
            }
            if(summary.processed%20===0) console.log("Progress",summary.processed,"new variants",summary.created,"errors",summary.failures.length);
          }
          console.log("FINISHED",JSON.stringify(summary));
          console.log("Stored counts",await call("/status"));
          if(!summary.done || summary.processed<300)throw Error("Expected all 336 staging media processed");
          if(summary.failures.length>0)process.exitCode=2;
          JS
