name: Format Cloudflare provider helper
on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/format-cf-provider-temp.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npx prettier --write app/features/admin/analytics/cloudflare-web-analytics.server.ts
      - name: Print formatted source
        run: |
          node -e '
            const fs = require("fs");
            console.log("FORMAT_BEGIN");
            console.log(fs.readFileSync("app/features/admin/analytics/cloudflare-web-analytics.server.ts").toString("base64"));
            console.log("FORMAT_END");
          '
