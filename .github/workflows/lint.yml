name: PHP lint and JavaScript syntax
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js admin/js/*.js; do
            node --check "$file"
          done
