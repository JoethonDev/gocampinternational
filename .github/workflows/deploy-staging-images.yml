name: Deploy responsive images to Cloudflare staging
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths: [".github/workflows/deploy-staging-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npm run cf-typegen && npm run typecheck
      - run: npm run build
      - name: Deploy staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: da59dca47179969defd66c61b710bbdb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured; no deployment was attempted"
            exit 1
          fi
          npx wrangler deploy
