name: Responsive layout browser checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/responsive-design-system
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run PHP test server and responsive browser smoke
        run: |
          php -S 127.0.0.1:8765 local-router.php >/tmp/gocamp-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          node tests/responsive-layout.cjs
      - name: Upload sample tablet and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gocamp-responsive-screenshots
          path: /tmp/gocamp-*.png
          if-no-files-found: ignore
          retention-days: 3
