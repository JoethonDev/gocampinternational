name: PHP visibility checks
on:
  push:
    branches:
      - main
      - feature/section-visibility-controls
  pull_request:
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Test visibility behavior
        run: php tests/section-visibility-test.php
      - name: Test description display
        run: php tests/description-display-test.php
      - name: Test media library renames
        run: php tests/media-library-rename-test.php

      - name: HTTP smoke tests for PHP routes
        run: |
          php -S 127.0.0.1:8765 local-router.php >/tmp/gocamp-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          for path in / /destinations/uk /programs "/program/category?category=adult-academic" /admin; do
            echo "Checking $path"
            http_code=$(curl -sS -L -o /tmp/gocamp-response -w "%{http_code}" "http://127.0.0.1:8765$path")
            if [ "$http_code" != "200" ]; then
              cat /tmp/gocamp-server.log
              cat /tmp/gocamp-response
              exit 1
            fi
          done
          curl -fsS http://127.0.0.1:8765/programs -o /tmp/gocamp-programs-response
          grep -q 'id="programModal-uk-young-professional"' /tmp/gocamp-programs-response
          curl -fsS http://127.0.0.1:8765/destinations/uk -o /tmp/gocamp-destination-response
          grep -q 'id="destination-intro"' /tmp/gocamp-destination-response
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/admin/media-library)
          test "$code" = "302"
