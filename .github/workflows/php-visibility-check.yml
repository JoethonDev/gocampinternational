name: PHP visibility checks
on:
  push:
    branches:
      - main
      - feature/section-visibility-controls
  pull_request:
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Verify Cloudflare Worker API protocol and environment isolation
        run: |
          node --check worker/src/core.js
          node --check worker/src/index.js
          node --test worker/tests/gateway.test.js
      - name: Verify external catalog adapter is opt-in
        run: php tests/external-catalog-adapter-test.php
      - name: Test visibility behavior
        run: php tests/section-visibility-test.php
      - name: Test authenticated bulk action logic and visibility inheritance
        run: php tests/admin-bulk-visibility-test.php
      - name: Test description display
        run: php tests/description-display-test.php
      - name: Test media library renames
        run: php tests/media-library-rename-test.php
      - name: Test admin UI regressions
        run: php tests/admin-ui-regression-test.php
      - name: Check dynamic academic copy and gallery policy
        run: php tests/academic-gallery-content-test.php
      - name: Validate UK Soccer gallery images
        run: php tests/soccer-media-test.php
      - name: Test safe Soccer image migration
        run: php tests/soccer-image-migration-test.php

      - name: Check InfinityFree deployer preserves live data
        run: python3 -m unittest discover -s tests -p 'test_infinityfree_deploy.py' -v

      - name: Test cPanel staging FTP modes and preservation
        run: |
          python3 -m unittest discover -s tests -p 'test_cpanel_staging_deploy.py' -v
          python3 -m py_compile deploy/cpanel-staging-deploy.py deploy/apply-uk-content-migration.py

      - name: Test reviewed development catalog migration safety and idempotence
        run: php tests/uk-content-migration-test.php
      - name: Test reviewed academic editorial migration
        run: php tests/academic-copy-migration-test.php

      - name: Validate public routes against current catalog data
        run: |
          php -S 127.0.0.1:8765 local-router.php >/tmp/gocamp-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          if ! php tests/catalog-http-smoke-test.php http://127.0.0.1:8765; then
            cat /tmp/gocamp-server.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/admin/media-library -o /tmp/gocamp-media-login
          grep -q 'Admin Access' /tmp/gocamp-media-login
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/admin/media-library.php)
          test "$code" = "302"