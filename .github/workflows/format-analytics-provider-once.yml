name: Format Cloudflare analytics integration once
on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/format-analytics-provider-once.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npx prettier --write app/routes/admin-analytics.tsx
      - name: Print source for connector
        run: |
          node -e '
            const fs = require("fs");
            console.log("GOCAMP_FORMAT_BEGIN");
            console.log(fs.readFileSync("app/routes/admin-analytics.tsx").toString("base64"));
            console.log("GOCAMP_FORMAT_END");
          '
