name: Temporary GoCamp staging R2 uploads ingest
on:
  push:
    branches: [migration/cloudflare-react-workers-pr40]
    paths:
      - .github/workflows/gocamp-r2-uploads-once.yml
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ingest verified GitHub uploads into staging R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            https://gocamp-uploads-import-temp.elprincedoca.workers.dev/ingest-gocamp-upload-20261101
