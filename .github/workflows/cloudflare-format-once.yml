name: One-time formatting for GoCamp Cloudflare migration
on:
  push:
    branches: [migration/cloudflare-react-workers-pr40]
    paths: [".github/workflows/cloudflare-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-react-workers-pr40
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - name: Format files checked by the Cloudflare CI gate
        working-directory: cloudflare-app
        run: |
          npm ci
          npm run format
      - name: Commit only deterministic formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-app/app cloudflare-app/workers cloudflare-app/scripts
          if ! git diff --cached --quiet; then
            git commit -m 'style(cloudflare): autoformat migration source for CI'
            git push origin HEAD:migration/cloudflare-react-workers-pr40
          fi
