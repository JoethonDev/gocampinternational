name: Format staging SEO changes
on:
  push:
    branches:
      - codex/staging-seo-standards-20261112
    paths:
      - ".github/workflows/staging-seo-format-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: cloudflare-app
      - name: Format modified SEO files
        run: |
          cd cloudflare-app
          npx prettier --write app/features/admin/catalog/SeoEditor.tsx app/lib/seo-discovery.server.ts app/routes/program.tsx
          cd ..
          git add cloudflare-app/app/features/admin/catalog/SeoEditor.tsx cloudflare-app/app/lib/seo-discovery.server.ts cloudflare-app/app/routes/program.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(staging): format SEO implementation"
            git push origin HEAD:codex/staging-seo-standards-20261112
          fi
