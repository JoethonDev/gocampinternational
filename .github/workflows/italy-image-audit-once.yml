name: Italy live image audit (one time)
on:
  push:
    branches: [feat/staging-r2-responsive-images-20261101]
    paths: [".github/workflows/italy-image-audit-once.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python3 -m pip install --quiet pillow --break-system-packages
      - name: Compare live staging Italy media, alternatives and rendered HTML
        run: |
          python3 - <<'PY'
          import urllib.request,io,base64
          from PIL import Image,ImageFilter,ImageStat
          base="https://gocamp-migration-staging.elprincedoca.workers.dev"
          items={
            "italy_original":"/media/10c8f0ee-e6a6-59e3-acb1-b6ddf3ae9f97",
            "italy_desktop":"/media/10c8f0ee-e6a6-59e3-acb1-b6ddf3ae9f97?variant=desktop&v=ai4k-20261101",
            "italy_banner":"/images/italy_banner.webp?variant=desktop&v=ai4k-20261101",
            "italy_culture":"/images/italy-culture-camp-rome-group.webp?variant=desktop",
            "italy_small":"/images/italy.webp",
          }
          for name,path in items.items():
            req=urllib.request.Request(base+path,headers={"User-Agent":"GoCamp staging image diagnostic"})
            try:
              with urllib.request.urlopen(req,timeout=25) as response:
                buf=response.read()
                etag=response.headers.get("etag")
                ct=response.headers.get("content-type")
              image=Image.open(io.BytesIO(buf))
              width,height=image.size
              thumb=image.convert("RGB"); thumb.thumbnail((240,200),Image.Resampling.LANCZOS)
              out=io.BytesIO();thumb.save(out,"JPEG",quality=58,optimize=True)
              grayscale=image.convert("L"); grayscale.thumbnail((400,400))
              edgestat=ImageStat.Stat(grayscale.filter(ImageFilter.FIND_EDGES)).stddev[0]
              print("IMAGE_INFO",name,"dimensions",width,height,"bytes",len(buf),"etag",etag,"contentType",ct,"edge_std",round(edgestat,2))
              print("IMAGE_THUMB",name,base64.b64encode(out.getvalue()).decode())
            except Exception as err:print("IMAGE_ERROR",name,repr(err))
          req=urllib.request.Request(base+"/destinations/italy")
          with urllib.request.urlopen(req,timeout=25) as response: html=response.read().decode("utf-8","replace")
          needle="10c8f0ee-e6a6-59e3-acb1-b6ddf3ae9f97"
          i=html.find(needle)
          print("ITALY_HTML_MEDIA_REF",i,"FRAGMENT",html[max(0,i-360):i+500].replace("\n"," "))
          PY
