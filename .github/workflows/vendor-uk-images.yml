name: Vendor UK academic media into PR branch
on:
  push:
    branches: [feat/uk-academic-programs-reviewed]
    paths:
      - scripts/vendor_uk_academic_images.py
      - .github/workflows/vendor-uk-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/uk-academic-programs-reviewed
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codecs
        run: python -m pip install 'Pillow>=11,<13' 'pillow-avif-plugin>=1.5,<2'
      - name: Download and optimize external academic images
        run: python scripts/vendor_uk_academic_images.py
      - name: Validate program data PHP syntax
        run: php -l data/all_programs.php
      - name: Commit images and local paths back to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all_programs.php images/uk-academic-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Vendor optimized academic images to local WebP assets"
            git push origin HEAD:feat/uk-academic-programs-reviewed
          fi
