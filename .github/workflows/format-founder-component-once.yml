name: Format founder component once
on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/format-founder-component-once.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npx prettier --write app/features/about/FounderFeature.tsx
      - name: Print formatted source
        run: |
          node -e '
            const fs = require("fs");
            console.log("FOUNDER_FORMAT_BEGIN");
            console.log(fs.readFileSync("app/features/about/FounderFeature.tsx").toString("base64"));
            console.log("FOUNDER_FORMAT_END");
          '
