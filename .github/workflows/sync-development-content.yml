name: Sync development hosting content and prepare destination images

on:
  push:
    branches:
      - feat/destination-photos-hide-gallery-details-develop-20261029
    paths:
      - .github/workflows/sync-development-content.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-development-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infinityfree-development
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP and image resize support
        run: python -m pip install 'Pillow>=11,<13'
      - name: Retrieve hosted public catalogs (FTPS READ only)
        env:
          GOCAMP_SYNC_DIR: ${{ runner.temp }}/gocamp-hosted-data
          INFINITYFREE_FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          INFINITYFREE_FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: python scripts/download-development-catalogs.py
      - name: Merge hosted edits and preserve new Git records
        env:
          GOCAMP_SYNC_DIR: ${{ runner.temp }}/gocamp-hosted-data
        run: php scripts/sync-development-catalogs.php . "$GOCAMP_SYNC_DIR"
      - name: Create optimized self-hosted destination WebP images
        run: python scripts/prepare-destination-images.py
      - name: Validate merged catalog and regression tests before commit
        run: |
          php -l data/all_programs.php
          php -l data/programs.php
          php -l data/destinations.php
          php -l data/site_settings.php
          php -l data/camp_memories.php
          php -l sections/program_card_modern.php
          php -l index.php
          php tests/description-display-test.php
          php tests/section-visibility-test.php
          python -m unittest discover -s tests -p test_infinityfree_deploy.py -v
      - name: Commit the hosted data merge and the generated images to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/all_programs.php data/programs.php data/destinations.php data/site_settings.php data/camp_memories.php data/faq.json
          git add -- images/uk-destination-upscaled.webp images/italy-destination-upscaled.webp images/france-destination-upscaled.webp
          test -f images/uk-destination-upscaled.webp
          test -f images/italy-destination-upscaled.webp
          test -f images/france-destination-upscaled.webp
          if git diff --cached --quiet; then
            echo 'Nothing to commit after the snapshot; unexpected.'
            exit 1
          fi
          git commit -m "Sync development content and add optimized destination images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
